_format_version: "3.0"
_transform: true

services:
  - name: kong-status
    url: http://localhost:8001     # ✅ container name + actual port
    routes:
          - name: status-route
            paths:
             - /status
            strip_path: true
            
    plugins:
          - name: request-termination
            config:
              status_code: 200
              message: "OK"
              
  - name: expense-service
    url: http://expense-service.public:9820      # ✅ container name + actual port
    routes:
      - name: expense-route
        paths:
          - /expense/v1
        strip_path: false
        preserve_host: false
    plugins:
      - name: auth-injector
        config:
          auth_service_url: "http://auth-service.public:9895/auth/v1/ping"   # ✅ fixed port

  - name: auth-service
    url: http://auth-service.public:9895         # ✅ container name + actual port
    routes:
      - name: auth-route
        paths:
          - /auth/v1
        strip_path: false
        preserve_host: false

  - name: user-service
    url: http://user-service.public:9810         # ✅ added userservice too
    routes:
      - name: user-route
        paths:
          - /user/v1
        strip_path: false
        preserve_host: false
    plugins:
      - name: auth-injector
        config:
          auth_service_url: "http://auth-service.public:9895/auth/v1/ping"
  
  - name: data-science-service
    url: http://ds-service.public:80         # ✅ added userservice too
    routes:
      - name: data-science-route
        paths:
          - /v1/ds
        strip_path: false
        preserve_host: false
    plugins:
      - name: auth-injector
        config:
          auth_service_url: "http://auth-service.public:9895/auth/v1/ping"
