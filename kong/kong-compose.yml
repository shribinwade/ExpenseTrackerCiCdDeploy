version: '3.9'

services:

  kong:
    image: kong:3.6
    container_name: kong-gateway

    environment:
      KONG_DATABASE: "off"

      KONG_DECLARATIVE_CONFIG: /kong/config/kong.yml   # ✅ mounted below

      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr

      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl

      KONG_LOG_LEVEL: debug
      KONG_PLUGINS: bundled,auth-injector          # ✅ register custom plugin
      KONG_LUA_PACKAGE_PATH: "/usr/local/custom-plugins/?.lua;;"      # ✅ where Lua will look

    volumes:
      # Kong declarative config
      - ../config/kong.yml:/kong/config/kong.yml
      
      # Custom plugin folder (contains auth-injector/handler.lua + schema.lua)
      - ../kong/plugins/auth-injector:/usr/local/share/lua/5.1/kong/plugins/auth-injector

    ports:
      - "8005:8000"              # Proxy
      - "127.0.0.1:8001:8001"    # Admin API (HTTP)
      - "8443:8443"              # HTTPS proxy
      - "127.0.0.1:8444:8444"    # Admin API (HTTPS)
 
    extra_hosts:
      - "host.docker.internal:host-gateway"          # ✅ needed on Linux for host.docker.internal